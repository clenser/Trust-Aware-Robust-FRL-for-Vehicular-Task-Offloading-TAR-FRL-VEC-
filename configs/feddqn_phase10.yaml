project: trust-aware-vanet-frl
config_name: feddqn_phase10
notes: Phase 10 full evaluation configuration with 10 heterogeneous non-IID clients, 8 rounds, and 10 random seeds.
seed: 0

scenario:
  num_vehicles: 10
  num_edge_nodes: 2
  mobility: medium
  task_load: medium
  connectivity_range_m: 150.0
  malicious_client_ratio: 0.0
  num_steps: 10
  trust_lambda: 0.70
  bandwidth_hz: 10000000.0
  vehicle_cpu_ghz: 2.0

detector:
  tau_anomaly: 0.50
  m2_dir_threshold: 0.45
  m3_stale_threshold: 0.50
  m4_orig_threshold: 0.00

dqn:
  hidden: [16, 16]
  lr: 0.001
  gamma: 0.99
  batch_size: 4
  capacity: 1000
  target_sync_steps: 20
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_episodes: 8
  warmup_steps: 0
  max_grad_norm: 10.0

federated:
  num_clients: 10
  rounds: 8
  local_episodes: 1
  participation_fraction: 1.0
  strategy: trust_threshold
  alpha: 0.5
  tau_exc: 0.35
  clip_c: 3.0
  dropout_prob: 0.0
  train_independent: false
  eval_seeds: [10, 11]

  # v4 honest Non-IID resource table (exact per-client CPU/bandwidth).
  # All other conditions fixed to the declared IID baseline
  # (mobility medium, task_load medium, link_reliability 0.90) so that
  # resource heterogeneity is the isolated non-IID factor.
  client_conditions:
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 1.0
      bandwidth_hz: 5000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 1.2
      bandwidth_hz: 6500000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 1.5
      bandwidth_hz: 8000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 1.8
      bandwidth_hz: 10000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 2.0
      bandwidth_hz: 10000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 2.2
      bandwidth_hz: 12000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 2.4
      bandwidth_hz: 14000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 2.6
      bandwidth_hz: 16000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 2.8
      bandwidth_hz: 18000000.0
    - mobility: medium
      task_load: medium
      link_reliability: 0.90
      vehicle_cpu_ghz: 3.0
      bandwidth_hz: 20000000.0
